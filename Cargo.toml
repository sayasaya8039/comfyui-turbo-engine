[workspace]
resolver = "2"
members = [
    "crates/comfy-core",
    "crates/comfy-inference",
    "crates/comfy-julia",
    "crates/comfy-nodes",
    "crates/comfy-server",
    "crates/comfy-zig",
    "crates/comfy-python",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = "0.25"
